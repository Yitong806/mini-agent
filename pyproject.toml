[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal AI agent framework built from scratch — ReAct loop, tool calling, and a thin multi-provider LLM layer (OpenAI / DeepSeek / Claude). ~150 lines of core, zero framework dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "yitong806", email = "yitong.wang.ieee@gmail.com"}
]
keywords = ["agent", "react", "llm", "ai", "minimal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Yitong806/mini-agent"
Repository = "https://github.com/Yitong806/mini-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]